<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#1747C9"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- left pane: local files -->
  <rect x="188" y="248" width="300" height="528" rx="44" fill="url(#pane)"/>
  <rect x="228" y="300" width="150" height="26" rx="13" fill="#9DB6F2"/>
  <rect x="228" y="356" width="220" height="26" rx="13" fill="#C7D6FA"/>
  <rect x="228" y="412" width="190" height="26" rx="13" fill="#C7D6FA"/>
  <rect x="228" y="468" width="210" height="26" rx="13" fill="#C7D6FA"/>
  <!-- right pane: bucket -->
  <rect x="536" y="248" width="300" height="528" rx="44" fill="url(#pane)"/>
  <path d="M606 340 h160 l-22 196 a26 26 0 0 1 -26 23 h-64 a26 26 0 0 1 -26 -23 z" fill="#2F6BF0"/>
  <ellipse cx="686" cy="340" rx="80" ry="24" fill="#5B8CFF"/>
  <ellipse cx="686" cy="340" rx="56" ry="13" fill="#1747C9" opacity=".55"/>
  <!-- transfer arrow crossing both panes -->
  <path d="M330 672 H660" stroke="#FFB020" stroke-width="56" stroke-linecap="round"/>
  <path d="M630 604 L716 672 L630 740" fill="none" stroke="#FFB020" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
