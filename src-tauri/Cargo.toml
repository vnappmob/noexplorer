[package]
name = "noexplorer"
version = "0.4.33"
description = "Dual-pane drag & drop file manager for S3-compatible storage"
authors = ["Kris Luu <kris.luu@vnappmob.com>"]
license = "MIT"
repository = "https://github.com/vnappmob/noexplorer"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "noexplorer_lib"
# Desktop only: the template's "staticlib"/"cdylib" exist for iOS/Android and made every dev build
# link two extra libraries (the .a alone was 0.73 GB). ADR-024.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-smithy-types = { version = "1.8.1", features = ["http-body-1-x"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "process"] }
futures = "0.3.34"
walkdir = "2.5.0"
mime_guess = "2.0.5"
dirs = "7.0.0"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
auto-launch = "0.6"
# WebDAV/Nextcloud (webdav.rs): the same reqwest/rustls/quick-xml/percent-encoding builds the
# updater and plist already use, so nothing new is compiled.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
quick-xml = "0.42"
percent-encoding = "2"
# Box (box_api.rs): SHA-1 digests for upload sessions, base64 for the Digest header; both already
# built for aws-smithy-checksums / the updater.
sha1 = "0.11"
# Compare (compare.rs): S3 ETags are MD5s; already built for aws-smithy-checksums.
md-5 = "0.11"
base64 = "0.22"
keyring = "4.2.0"
# Self-signed HTTPS (tls.rs): certificate pinning on rustls, and reqwest as the S3 SDK's HTTP client
# for pinned accounts. All already built for reqwest / the AWS SDK.
rustls-platform-verifier = "0.7"
sha2 = "0.11"
# Azure Blob (azure.rs): Shared Key signatures; already built for the AWS SDK.
hmac = "0.13"
# SFTP (sftp.rs, experimental): the SFTP protocol only; SSH itself is the system `ssh` command
# (your keys, agent, ~/.ssh/config and known_hosts).
russh-sftp = "3"
http = "1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
notify = "8.2.0"
# Grid thumbnails (thumbs.rs): Tauri already builds `image` (PNG); JPEG/WebP/GIF add small decoders.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }


[target.'cfg(unix)'.dependencies]
# macOS getattrlistbulk for the folder-size scanner (scan.rs); Linux trash dates (trash.rs).
# Already in the tree via Tauri.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# NSFileManager trashItemAtURL (trash.rs), volume capacity (local.rs); already in the tree via Tauri.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSValue"] }
objc2 = "0.6"

# Dev/test builds: line tables for our code (backtraces keep file:line), no debug info for
# dependencies. No split-debuginfo setting: macOS already defaults to "unpacked", and "unpacked"
# is rejected on Windows MSVC (stable). Release builds are unchanged. ADR-024.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
