[package]
name = "noexplorer"
version = "0.2.2"
description = "Dual-pane drag & drop file manager for S3-compatible storage"
authors = ["Kris Luu <kris.luu@vnappmob.com>"]
license = "MIT"
repository = "https://github.com/vnappmob/noexplorer"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "noexplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-smithy-types = "1.8.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros"] }
futures = "0.3.34"
walkdir = "2.5.0"
mime_guess = "2.0.5"
dirs = "7.0.0"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
auto-launch = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
