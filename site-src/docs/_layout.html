<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · NoExplorer docs</title>
    <meta name="description" content="{{desc}}" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.png" />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/docs.css" />
  </head>
  <body class="docs">
    <!-- Generated by scripts/build-docs.mjs from site-src/docs/. Edit those files, not this one. -->
    <header class="nav">
      <a class="brand" href="/"><img src="/icon.svg" alt="" width="28" height="28" />NoExplorer</a>
      <nav>
        <a href="/docs/">Docs</a>
        <a href="https://github.com/vnappmob/noexplorer/releases/latest">Download</a>
        <a href="https://github.com/vnappmob/noexplorer" class="gh">GitHub</a>
      </nav>
    </header>
    <div class="docs-wrap">
      <aside class="docs-nav" aria-label="Docs">{{nav}}</aside>
      <article class="prose">
        <h1>{{title}}</h1>
        {{body}}
        <nav class="pager" aria-label="Next and previous">{{pager}}</nav>
      </article>
    </div>
    <footer>
      <p>
        <a href="/">Home</a> · <a href="https://github.com/vnappmob/noexplorer">GitHub</a> ·
        <a href="https://github.com/vnappmob/noexplorer/blob/main/CHANGELOG.md">Changelog</a> ·
        <a href="/docs/privacy">Privacy</a> · <a href="/docs/code-signing">Code signing</a> ·
        <a href="https://github.com/vnappmob/noexplorer/issues">Report an issue</a>
      </p>
      <p class="muted">MIT License · Made by Kris Luu at <a href="https://github.com/vnappmob">VNAppMob</a></p>
    </footer>
  </body>
</html>
