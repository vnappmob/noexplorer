# Runs on every push / PR. Must stay green before merging to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + format + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust (fmt + clippy + tests incl. S3 round-trip)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # tauri::generate_context!() embeds ../dist, so the frontend must be built first.
      - run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Start local S3 (SeaweedFS)
        run: ./scripts/dev-s3.sh up
      - run: cargo test
        working-directory: src-tauri
        env:
          NOEXPLORER_TEST_ENDPOINT: http://localhost:8333
          NOEXPLORER_TEST_KEY: devkey
          NOEXPLORER_TEST_SECRET: devsecret123

  build:
    name: Build check (${{ matrix.os }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cargo build
        working-directory: src-tauri
