# Builds, signs (macOS: Developer ID + notarization) and publishes installers.
# Trigger: push a tag `vX.Y.Z` matching package.json "version" (see docs/RELEASING.md).
# Output: a DRAFT GitHub Release with all installers. Review it, then click "Publish" —
# the website's download buttons only see published releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          c=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
          [ "$v" = "$c" ] || { echo "::error::Cargo.toml version $c != package.json $v"; exit 1; }

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization. If these secrets are missing the app is
          # built unsigned (users must right-click → Open the first time).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the auto-update bundles (*.sig) and lets tauri-action publish latest.json,
          # which installed apps poll (tauri.conf.json → plugins.updater.endpoints).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NoExplorer ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Download the installer for your OS below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      # tauri-action notarizes the .app but only signs the .dmg. Notarize + staple the .dmg too
      # (Apple's guidance: notarize the outermost container), then replace the release asset.
      - name: Notarize and staple the .dmg (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Secrets can't be tested in `if:`; skip quietly when signing isn't configured.
          [ -n "$APPLE_ID" ] || { echo "No Apple secrets: skipping .dmg notarization"; exit 0; }
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber

  # Windows has its own job because signing goes through SignPath (ADR-030), which can only sign
  # files uploaded as workflow artifacts and needs a manual approval per request. Until the repo
  # variable SIGNPATH_ORGANIZATION_ID is set, this builds unsigned installers exactly like before.
  windows:
    needs: verify
    runs-on: windows-latest
    env:
      SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      # ---- unsigned (SignPath not set up) ----
      - uses: tauri-apps/tauri-action@v1
        if: env.SIGNED != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NoExplorer ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Download the installer for your OS below.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # ---- signed: app exe first, so the installed program carries the signature too ----
      - name: Build the app (no installers yet)
        if: env.SIGNED == 'true'
        run: npx tauri build --no-bundle
      - name: Upload noexplorer.exe for signing
        if: env.SIGNED == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: src-tauri/target/release/noexplorer.exe
      - name: Sign noexplorer.exe (SignPath, needs approval)
        if: env.SIGNED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'noexplorer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # time for the maintainer to approve
          output-artifact-directory: signed-exe
      - name: Bundle the installers around the signed exe
        if: env.SIGNED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp signed-exe/noexplorer.exe src-tauri/target/release/noexplorer.exe
          npx tauri bundle
          # Fixed names for the SignPath artifact configuration (.signpath/installers.xml).
          mkdir installers
          cp src-tauri/target/release/bundle/nsis/*-setup.exe installers/noexplorer-setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi installers/noexplorer.msi
      - name: Upload installers for signing
        if: env.SIGNED == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: installers/
      - name: Sign the installers (SignPath, needs approval)
        if: env.SIGNED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'noexplorer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers
      # Authenticode signing changes the files, so the updater signatures (*.sig) must be made
      # again from the signed installers, or installed apps reject the update.
      - name: Updater signatures + upload to the draft release
        if: env.SIGNED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir out
          cp signed-installers/noexplorer-setup.exe "out/NoExplorer_${v}_x64-setup.exe"
          cp signed-installers/noexplorer.msi "out/NoExplorer_${v}_x64_en-US.msi"
          for f in out/*; do npx tauri signer sign "$f"; done
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
      - name: Keep the updater signatures for latest.json
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-updater
          path: out/*.sig

  # Signed Windows builds skip tauri-action, so their entries are added to latest.json here,
  # after every other job has written its own (no read-modify-write race).
  windows-updater-json:
    needs: [build, windows]
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: windows-updater, path: sigs }
      - name: Merge the Windows entries into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -p latest.json -D cur || true
          node scripts/updater-json-windows.mjs "$GITHUB_REF_NAME" sigs cur/latest.json > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
